<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17090f">
<title>BG FC 2026/27</title>
<style>
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#17090f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{width:min(88vw,420px);text-align:center}
h1{font-size:34px;margin:0 0 26px}
button{width:100%;border:0;border-radius:16px;padding:18px 20px;font:700 18px inherit;background:#fff;color:#111}
</style>
</head>
<body>
<main>
<h1>BG FC 2026/27</h1>
<button id="add">Add all matches</button>
</main>
<script>
const feed='webcal://raw.githubusercontent.com/pcabrales/kaggrales/main/bgfc/BG_FC_2026-27.ics';
const events=[
['DPS Basel FC vs BG FC','20260915T160000Z','20260915T170000Z'],
['BG FC vs Joga Bonito FC','20260921T160000Z','20260921T170000Z'],
['FC Sportfreunde vs BG FC','20260928T160000Z','20260928T170000Z'],
['FC Max Basel vs BG FC','20261001T160000Z','20261001T170000Z'],
['Inter Basel vs BG FC','20261006T160000Z','20261006T170000Z'],
['FC Baselona vs BG FC','20261013T160000Z','20261013T170000Z'],
['BG FC vs ASK FC','20261020T160000Z','20261020T170000Z'],
['BG FC vs Rhine Madrid','20261026T170000Z','20261026T180000Z'],
['BG FC vs Inter Ya Ma FC','20261029T170000Z','20261029T180000Z']
];
const isAndroid=/Android/i.test(navigator.userAgent);
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function g(e){
 const p=new URLSearchParams({action:'TEMPLATE',text:e[0],dates:e[1]+'/'+e[2],details:'BG FC · Seven League Basel'});
 return 'https://calendar.google.com/calendar/render?'+p;
}
function next(){
 let i=Number(sessionStorage.getItem('bgfc_i')||0);
 if(i>=events.length){sessionStorage.removeItem('bgfc_i');sessionStorage.removeItem('bgfc_run');return}
 sessionStorage.setItem('bgfc_i',String(i+1));
 location.href=g(events[i]);
}
document.getElementById('add').onclick=()=>{
 if(isIOS){location.href=feed;return}
 if(isAndroid){
   sessionStorage.setItem('bgfc_i','0');
   sessionStorage.setItem('bgfc_run','1');
   next();
   return;
 }
 location.href='https://calendar.google.com/calendar/render?cid='+encodeURIComponent(feed);
};
addEventListener('pageshow',()=>{
 if(isAndroid&&sessionStorage.getItem('bgfc_run')==='1'&&Number(sessionStorage.getItem('bgfc_i')||0)>0){
   const i=Number(sessionStorage.getItem('bgfc_i')||0);
   if(i<events.length)setTimeout(next,500);
   else{sessionStorage.removeItem('bgfc_i');sessionStorage.removeItem('bgfc_run')}
 }
});
</script>
</body>
</html>
